# Safety envelope for the reBot B601-RS. DATA, not code: a change here is a
# reviewable diff and needs an experiment-registry entry, because it changes
# what the robot is permitted to do.
#
# PROVISIONAL — every number below is a placeholder pending the Day-2 bring-up
# measurement. Do not run powered autonomous motion against these until Day 2
# has replaced them with measured values and the mentor has signed off (Day-1
# acceptance gate).
workspace:            # robot base frame, metres
  x_min: 0.15
  x_max: 0.55
  y_min: -0.30
  y_max: 0.30
  z_min: 0.02         # table surface + clearance
  z_max: 0.50
motion:
  max_joint_velocity: 1.0     # rad/s per joint
  max_cartesian_speed: 0.25   # m/s EEF
  max_step_distance: 0.15     # m per commanded waypoint
  max_gripper_force: 1.0      # normalised
home:                 # approved home configuration; safe_home verifies arrival
  # FK of the zero joint configuration on the vendor URDF
  # (00-arm-rs_asm-v3, frame gripper_end), cross-checked placo vs Pinocchio to
  # machine precision. This is where the plugin's safe_zero() actually lands.
  # The scaffold previously carried an invented [0.30, 0.00, 0.35], which is
  # 0.1323 m away — safe_home would have faulted on every successful home.
  # Still URDF-derived, not measured: Day 2 confirms it against the arm.
  xyz: [0.30171, 0.0, 0.217747]
  tolerance_m: 0.02   # arrival radius — must exceed measured repeatability,
                      # so Day 2 sets it FROM repeatability.csv, not before
